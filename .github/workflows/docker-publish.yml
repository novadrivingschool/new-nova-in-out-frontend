name: Build and push Docker image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_AUTH_URL=${{ vars.VITE_API_AUTH_URL || 'https://dev.auth-user.nio.novadrivingone.net' }}
            VITE_API_NOVA_IN_OUT_URL=${{ vars.VITE_API_NOVA_IN_OUT_URL || 'https://dev.api.nio.novadrivingone.net' }}
            VITE_ENABLE_SCREENSHOT_DELETE=${{ vars.VITE_ENABLE_SCREENSHOT_DELETE || 'true' }}
            VITE_DEV_ACTIVITY_BOT=${{ vars.VITE_DEV_ACTIVITY_BOT || 'false' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/novadrivingschool/nio-frontend:${{ steps.version.outputs.VERSION }}
            ghcr.io/novadrivingschool/nio-frontend:latest
