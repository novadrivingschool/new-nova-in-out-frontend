# nginx del CONTENEDOR del front: sirve la SPA (vue-router en modo history).
# El navegador llama directo a las APIs en sus subdominios; aquí no hay proxy.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # index.html nunca en caché: así una versión nueva se ve al recargar
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash (Vite): caché largo
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
